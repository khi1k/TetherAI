{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto; text-align: center;">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Tether Logo" style="height: 80px; margin-bottom: 1rem;">
    <h2>Welcome Back</h2>
    <p style="color: #64748b; margin-bottom: 2rem;">Log in to your Tether Business Hub</p>

    <form method="POST" style="text-align: left;">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@business.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <button type="submit" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>

    <p style="margin-top: 1.5rem; font-size: 0.9rem;">
        Don't have an account? <a href="/register" style="color: #2563eb; font-weight: bold; text-decoration: none;">Sign up here</a>
    </p>
</div>
{% endblock %}
